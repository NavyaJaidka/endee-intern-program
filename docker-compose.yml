version: '3.8'

# Docker Compose configuration for Endee Vector Database
# Usage: docker-compose up -d

services:
  endee:
    image: endeeio/endee-server:latest
    container_name: endee-vector-db
    ports:
      - "8080:8080"
    environment:
      # Optional: Set authentication token
      # NDD_AUTH_TOKEN: your_secure_token_here
      NDD_NUM_THREADS: "0"
    volumes:
      - endee-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  endee-data:
    driver: local

# Usage:
# 1. Start Endee: docker-compose up -d
# 2. Check health: curl http://localhost:8080/api/v1/health
# 3. Stop: docker-compose down
