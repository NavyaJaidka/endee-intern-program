services:
  - type: web
    name: endee-backend
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENDEE_BASE_URL
        value: http://localhost:8080 # Update this with your hosted Endee URL
      - key: LLM_PROVIDER
        value: openai # or anthropic
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_DEVICE
        value: cpu
